<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>校园怪谈：零Bug高跟真理版</title>
    <!-- 核心 Three.js (企业级稳定 CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'PingFang SC', sans-serif; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
        #ui-layer { pointer-events: none; z-index: 10; }
        .interactive { pointer-events: auto; touch-action: manipulation; }

        #cinematic-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.95) 100%);
            pointer-events: none; z-index: 5; mix-blend-mode: multiply;
        }
        #film-grain {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.08"/%3E%3C/svg%3E');
            pointer-events: none; z-index: 6; opacity: 0.6; mix-blend-mode: overlay;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: rgba(255, 255, 255, 0.9); border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 5px rgba(0,0,0,1); transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }
        .crosshair-active { 
            width: 18px !important; height: 18px !important; background: rgba(255, 30, 30, 0.8) !important; 
            border: 2px solid #fff; box-shadow: 0 0 20px rgba(255,0,0,0.8);
        }

        #joystick-base {
            position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%; z-index: 50; pointer-events: auto; backdrop-filter: blur(8px);
        }
        #joystick-stick {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(200,200,200,0.5)); 
            border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .action-btn {
            position: absolute; right: 40px; width: 75px; height: 75px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; z-index: 50; pointer-events: auto; backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            color: white; font-weight: bold; font-size: 14px; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: all 0.1s;
        }
        .action-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.3); }
        .btn-active-state { background: rgba(255, 50, 50, 0.4) !important; border-color: rgba(255, 100, 100, 0.8) !important; }
        
        #jump-btn { bottom: 40px; }
        #sprint-btn { bottom: 130px; }

        #transition-screen { background: black; transition: opacity 0.5s ease-in-out; z-index: 9999; }
        .pointer-none { pointer-events: none; }
    </style>
</head>
<body>

<div id="cinematic-overlay"></div>
<div id="film-grain"></div>

<div id="ui-layer" class="fixed inset-0 flex flex-col justify-between">
    <!-- 顶部 HUD -->
    <div class="p-4 md:p-6 flex justify-between items-start text-white">
        <div class="bg-black/60 p-3 md:p-4 rounded-xl border border-gray-700 backdrop-blur-md shadow-2xl">
            <h1 class="text-xl md:text-3xl font-black text-red-500 tracking-widest drop-shadow-[0_0_10px_rgba(255,0,0,0.5)]" id="day-display">第 1 天</h1>
            <p class="text-[10px] md:text-xs text-gray-300 mt-1 font-mono tracking-wider" id="stage-desc">LOC: CLASSROOM</p>
        </div>
        
        <div class="flex flex-col items-end gap-2">
            <!-- 装备加载监控 -->
            <div class="bg-black/70 px-3 py-2.5 rounded-xl border border-gray-600 backdrop-blur-md shadow-xl flex flex-col gap-1.5 w-[140px] md:w-[170px]">
                <div class="flex items-center gap-2">
                    <span class="text-xl drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]">👠</span>
                    <div class="text-left flex-1">
                        <p class="text-[11px] font-bold text-gray-300 tracking-wider">自身装备挂载</p>
                        <p class="text-[10px] md:text-xs font-mono mt-0.5 font-bold" id="obj-status">
                            <span class="text-yellow-400 animate-pulse">请求连接...</span>
                        </p>
                    </div>
                </div>
                <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden mt-0.5 border border-black flex">
                    <div id="loading-bar-earring" class="bg-blue-400 h-full w-0 transition-all duration-200"></div>
                    <div id="loading-bar-shoe" class="bg-purple-400 h-full w-0 transition-all duration-200"></div>
                </div>
            </div>
            
            <div id="reset-btn" class="bg-black/50 px-3 py-1.5 rounded-lg border border-gray-700 text-right interactive backdrop-blur-sm cursor-pointer hover:bg-gray-800 transition-colors">
                <p class="text-[10px] md:text-xs font-bold text-gray-400 pointer-none">↻ 重置物理视角</p>
            </div>
        </div>
    </div>

    <!-- 报告异常 -->
    <div class="absolute top-[55%] left-1/2 transform -translate-x-1/2 -translate-y-1/2 interactive flex flex-col items-center">
        <button id="report-btn" class="hidden px-8 py-3 bg-red-700/95 text-white font-bold rounded-xl border border-red-400 active:scale-95 flex items-center gap-3 backdrop-blur-md shadow-[0_0_30px_rgba(255,0,0,0.6)] transition-transform">
            <span class="text-3xl pointer-none">⚠️</span> 
            <div class="flex flex-col items-start pointer-none">
                <span class="text-xl tracking-widest leading-none">报告异常</span>
                <span id="target-name" class="text-[11px] text-yellow-300 mt-1 font-mono tracking-wide">目标: 未知</span>
            </div>
        </button>
    </div>

    <div id="joystick-base" class="hidden"><div id="joystick-stick"></div></div>
    <div id="jump-btn" class="action-btn hidden select-none"><span class="text-xl pointer-none">⏫</span><span class="pointer-none">跳跃</span></div>
    <div id="sprint-btn" class="action-btn hidden select-none"><span class="text-xl pointer-none">🏃</span><span id="sprint-txt" class="pointer-none">步行</span></div>

    <!-- 一切正常 -->
    <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 interactive z-40 w-full max-w-sm flex justify-center">
        <button id="normal-btn" class="px-10 py-4 bg-gray-900/90 border border-gray-500 text-white font-bold rounded-full text-lg hover:bg-gray-800 active:scale-95 backdrop-blur-lg shadow-[0_0_20px_rgba(0,0,0,0.8)] tracking-widest transition-transform">
            <span class="pointer-none">🚪 一切正常 (离开区域)</span>
        </button>
    </div>

    <!-- 开始界面 -->
    <div id="start-screen" class="absolute inset-0 bg-black/95 flex flex-col items-center justify-center p-6 text-center interactive z-50 backdrop-blur-xl">
        <h2 class="text-5xl md:text-7xl font-black mb-4 text-red-600 tracking-tighter drop-shadow-[0_0_20px_rgba(255,0,0,0.4)]">校园怪谈</h2>
        <h3 class="text-xl font-bold mb-8 text-gray-300 tracking-widest border-b border-gray-700 pb-4">零Bug 真理终局版</h3>
        <div class="max-w-md mb-10 text-left bg-gray-900/50 p-6 rounded-2xl border border-gray-800 shadow-2xl">
            <ul class="list-disc pl-5 space-y-3 text-sm text-gray-300">
                <li><span class="text-red-500 font-bold">彻底修复逻辑死锁：</span>移除了按键冲撞判定，无论报对报错，100%秒进转场！</li>
                <li><span class="text-purple-400 font-bold">完美高跟鞋穿模修复：</span>鞋子间距已拉开，方向已修正。低头可见随步伐交替的鞋尖，并伴随清脆音效。</li>
                <li>注意寻找环境里的异常，点击【推门进入】以激活音效引擎。</li>
            </ul>
        </div>
        <button id="start-btn" class="px-14 py-4 bg-red-800 text-white font-black rounded-full text-xl active:scale-95 shadow-[0_0_30px_rgba(255,0,0,0.5)] border border-red-500 transition-all hover:bg-red-700">
            推门进入 (激活音效)
        </button>
    </div>

    <div id="win-screen" class="hidden absolute inset-0 bg-white flex flex-col items-center justify-center p-8 text-center interactive z-50">
        <h2 class="text-6xl font-black mb-6 text-black tracking-tighter">逃出生天</h2>
        <p class="text-xl text-gray-700 font-bold mb-10">极致的观察力，完美打破了循环。</p>
        <button onclick="location.reload()" class="px-12 py-4 bg-black text-white font-bold rounded-full text-xl shadow-2xl hover:scale-105 transition-transform">重返现实</button>
    </div>

    <div id="transition-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center">
        <h2 id="transition-title" class="text-4xl md:text-6xl font-black text-white mb-4 drop-shadow-[0_0_20px_rgba(255,255,255,0.8)]"></h2>
        <p id="transition-desc" class="text-red-500 text-base md:text-xl font-bold tracking-widest max-w-sm leading-relaxed whitespace-pre-wrap"></p>
    </div>

    <div id="error-toast" class="hidden absolute top-24 left-1/2 -translate-x-1/2 z-[10000] max-w-md w-[92%] bg-red-950/90 border border-red-400 text-red-100 rounded-xl px-4 py-3 shadow-[0_0_20px_rgba(255,0,0,0.5)] backdrop-blur-md">
        <p class="text-xs font-mono tracking-wide">系统报错</p>
        <p id="error-toast-msg" class="text-sm mt-1 leading-relaxed break-words"></p>
    </div>

</div>

<script>
    let scene, camera, renderer, raycaster;
    
    // --- 核心状态 ---
    let currentDay = 1, currentStage = 1; 
    const MAX_DAYS = 14;
    let hasAnomalyToday = false, currentAnomalyId = null; 
    let isTransitioning = false, currentLookTarget = null, lastValidTarget = null; 

    const gameObjects = { stage1: {}, stage2: {} };
    // 鞋子不再是异常，它是身体部位！
    const interactableIds_1 = ['blackboard', 'clock', 'student', 'poster', 'door_stage1', 'computer'];
    const interactableIds_2 = ['exit_sign', 'extinguisher', 'locker', 'vending_machine', 'hall_door'];
    
    const nameMap = {
        'blackboard': '黑板题目', 'clock': '墙上时钟', 'student': '方块同学', 'poster': '墙上海报', 'door_stage1': '教室木门', 'computer': '讲台电脑',
        'exit_sign': '安全出口标志', 'extinguisher': '灭火器', 'locker': '铁皮储物柜', 'vending_machine': '自动贩卖机', 'hall_door': '走廊大门'
    };

    const STAGE_1_CENTER = new THREE.Vector3(0, 0, 0);
    const STAGE_2_CENTER = new THREE.Vector3(100, 0, 0);
    
    // --- 运动与步伐物理 ---
    const moveState = { forward: 0, right: 0 }; 
    const WALK_SPEED = 0.05, SPRINT_SPEED = 0.14;
    let isSprinting = false, currentSpeed = WALK_SPEED;
    
    // 步伐追踪器 (音效与身体部位摆动)
    let stepAccumulator = 0;
    let lastStepIndex = 0;

    const CAMERA_HEIGHT = 1.6;
    let yVelocity = 0, isGrounded = true;
    const GRAVITY = 0.012, JUMP_FORCE = 0.20;

    let targetRotationX = 0, targetRotationY = 0;
    let isLooking = false, prevLookX = 0, prevLookY = 0;
    const MAX_PITCH = Math.PI / 2.2; 
    
    let prevCamRotY = 0, prevCamRotX = 0;
    let camAngularVelY = 0, camAngularVelX = 0;
    
    const earringsSystem = []; 
    // 第一人称鞋子
    let leftShoeMesh = new THREE.Group();
    let rightShoeMesh = new THREE.Group();

    const globalTextures = {};
    const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });

    // --- 音效引擎 (高跟鞋脚步声) ---
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playHeelStep(volume = 1.0) {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(900, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.04);
        filter.type = 'highpass'; filter.frequency.value = 1000;
        gain.gain.setValueAtTime(volume * 0.8, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);

        osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.06);
    }

    // --- 装备状态监控 ---
    let objProgress = { earring: 0, shoe: 0, earringDone: false, shoeDone: false };
    function updateObjUI() {
        const el = document.getElementById('obj-status');
        const bE = document.getElementById('loading-bar-earring');
        const bS = document.getElementById('loading-bar-shoe');
        
        if (objProgress.earringDone && objProgress.shoeDone) {
            el.innerHTML = '<span class="text-green-400">✅ 装备挂载完毕</span>';
            bE.style.width = '50%'; bS.style.width = '50%';
            bE.className = "bg-green-500 h-full transition-all duration-300";
            bS.className = "bg-green-500 h-full transition-all duration-300";
        } else {
            let p1 = objProgress.earringDone ? 50 : (objProgress.earring / 100 * 50);
            let p2 = objProgress.shoeDone ? 50 : (objProgress.shoe / 100 * 50);
            el.innerHTML = `<span class="text-yellow-400 animate-pulse">⏳ 同步构建中...</span>`;
            bE.style.width = `${p1}%`; bS.style.width = `${p2}%`;
        }
    }

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);
        scene.fog = new THREE.FogExp2(0x020202, 0.04); 

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 100);
        camera.rotation.order = 'YXZ'; 
        
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        document.body.appendChild(renderer.domElement);
        raycaster = new THREE.Raycaster();

        scene.add(leftShoeMesh);
        scene.add(rightShoeMesh);

        generateSharedTextures();
        buildStage1_Classroom();
        buildStage2_Hallway();
        addCinematicLights();

        // 核心：并发加载两个装备 OBJ
        loadCustomOBJs(); 
        setupControls();

        window.addEventListener('resize', onWindowResize, false);
        
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.getElementById('joystick-base').classList.remove('hidden'); document.getElementById('joystick-base').classList.add('block');
            document.getElementById('jump-btn').classList.remove('hidden'); document.getElementById('jump-btn').classList.add('flex');
            document.getElementById('sprint-btn').classList.remove('hidden'); document.getElementById('sprint-btn').classList.add('flex');
        }
        animate();
    }

    // --- 📦 并发加载 真实提取几何体防偏移 ---
    function loadCustomOBJs() {
        if (typeof THREE.OBJLoader === 'undefined') {
            document.getElementById('obj-status').innerHTML = '<span class="text-red-400">❌ 引擎库异常</span>';
            return;
        }
        const objLoader = new THREE.OBJLoader();

        // --- 1. Earring.obj ---
        const earringUrl = 'https://hackerisnice.github.io/objsite/Earring.obj';
        const earringMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.1, emissive: 0x667788, emissiveIntensity: 0.5 });
        const fallbackGeo = new THREE.OctahedronGeometry(0.0035, 0); 
        const linkGeo = new THREE.CylinderGeometry(0.0005, 0.0005, 0.02, 4);
        const linkMat = new THREE.MeshStandardMaterial({color: 0xaaaaaa, metalness: 1.0, roughness: 0.4});
        const anchors = [ new THREE.Vector3(-0.07, -0.04, -0.09), new THREE.Vector3( 0.07, -0.04, -0.09) ];

        for(let anchorLoc of anchors) {
            const sys = { anchorLocal: anchorLoc, segments: 4, segLen: 0.03, nodes: [] };
            for(let i=0; i<=sys.segments; i++) {
                let mesh;
                if(i === sys.segments) {
                    mesh = new THREE.Group(); 
                    const tempMesh = new THREE.Mesh(fallbackGeo, earringMat);
                    tempMesh.scale.set(1, 1.5, 1); tempMesh.name = "fallback"; 
                    mesh.add(tempMesh);
                } else if(i > 0) { mesh = new THREE.Mesh(linkGeo, linkMat); } 
                else { mesh = new THREE.Group(); }
                scene.add(mesh);
                sys.nodes.push({ pos: new THREE.Vector3(), oldPos: new THREE.Vector3(), mesh: mesh });
            }
            earringsSystem.push(sys);
        }

        objLoader.load(
            earringUrl,
            (object) => {
                let extractedGeo = null;
                object.traverse((child) => { 
                    if (child.isMesh && !extractedGeo) { 
                        extractedGeo = child.geometry.clone(); 
                        if(!extractedGeo.attributes.normal) extractedGeo.computeVertexNormals(); 
                    }
                });
                
                if (extractedGeo) {
                    extractedGeo.center(); 
                    extractedGeo.computeBoundingBox();
                    const box = extractedGeo.boundingBox;
                    const maxDim = Math.max(box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z);
                    
                    if (maxDim > 0 && isFinite(maxDim)) {
                        const scale = 0.018 / maxDim; 
                        extractedGeo.scale(scale, scale, scale);

                        earringsSystem.forEach(sys => {
                            const tailGroup = sys.nodes[sys.segments].mesh;
                            const fallbackObj = tailGroup.getObjectByName("fallback");
                            if(fallbackObj) tailGroup.remove(fallbackObj);
                            
                            const finalMesh = new THREE.Mesh(extractedGeo, earringMat);
                            tailGroup.add(finalMesh); 
                        });
                        objProgress.earringDone = true; updateObjUI();
                    }
                }
            },
            (xhr) => { if (xhr.lengthComputable) { objProgress.earring = (xhr.loaded / xhr.total) * 100; updateObjUI(); } },
            () => { objProgress.earringDone = true; updateObjUI(); } 
        );

        // --- 2. Shoe.obj (作为玩家第一人称身体) ---
        const shoeUrl = 'https://hackerisnice.github.io/objsite/shoe.obj';
        const shoeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.6, side: THREE.DoubleSide });

        const fallbackShoeGeo = new THREE.BoxGeometry(0.12, 0.1, 0.25);
        const tempShoeL = new THREE.Mesh(fallbackShoeGeo, shoeMat); tempShoeL.name = "fallback";
        const tempShoeR = new THREE.Mesh(fallbackShoeGeo, shoeMat); tempShoeR.name = "fallback";
        leftShoeMesh.add(tempShoeL);
        rightShoeMesh.add(tempShoeR);

        objLoader.load(
            shoeUrl,
            (object) => {
                let extractedGeo = null;
                object.traverse((child) => { 
                    if (child.isMesh && !extractedGeo) { 
                        extractedGeo = child.geometry.clone(); 
                        if(!extractedGeo.attributes.normal) extractedGeo.computeVertexNormals(); 
                    }
                });

                if (extractedGeo) {
                    extractedGeo.center(); 
                    // 修正朝向：多数模型是面向前方的，如果不准可修改此处 (Math.PI 即 180度翻转)
                    extractedGeo.rotateY(Math.PI); 

                    extractedGeo.computeBoundingBox();
                    const box = extractedGeo.boundingBox;
                    const maxDim = Math.max(box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z);
                    
                    if (maxDim > 0 && isFinite(maxDim)) {
                        const scale = 0.25 / maxDim; // 缩放至约 25cm 长
                        extractedGeo.scale(scale, scale, scale);

                        leftShoeMesh.remove(leftShoeMesh.getObjectByName("fallback"));
                        rightShoeMesh.remove(rightShoeMesh.getObjectByName("fallback"));

                        const finalMeshL = new THREE.Mesh(extractedGeo, shoeMat);
                        const finalMeshR = new THREE.Mesh(extractedGeo, shoeMat);
                        finalMeshR.scale.x = -1; // 镜像右脚

                        // 给鞋子加上正确的基准高度 (高度的一半)
                        const yOffset = ((box.max.y - box.min.y) * scale) / 2;
                        finalMeshL.position.y = yOffset;
                        finalMeshR.position.y = yOffset;

                        leftShoeMesh.add(finalMeshL);
                        rightShoeMesh.add(finalMeshR);
                        
                        objProgress.shoeDone = true; updateObjUI();
                    }
                }
            },
            (xhr) => { if (xhr.lengthComputable) { objProgress.shoe = (xhr.loaded / xhr.total) * 100; updateObjUI(); } },
            () => { objProgress.shoeDone = true; updateObjUI(); }
        );
    }

    // --- 动态耳坠物理 ---
    function updateEarringsPhysics() {
        camera.updateMatrixWorld(true);
        let currRotY = camera.rotation.y, currRotX = camera.rotation.x;
        camAngularVelY = currRotY - prevCamRotY; camAngularVelX = currRotX - prevCamRotX;
        prevCamRotY = currRotY; prevCamRotX = currRotX;

        let camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        let camForward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

        earringsSystem.forEach((sys) => {
            for(let i=1; i<=sys.segments; i++) {
                let n = sys.nodes[i];
                let vel = n.pos.clone().sub(n.oldPos);
                
                let centrifugalForce = camRight.clone().multiplyScalar(camAngularVelY * i * 0.015);
                let forwardForce = camForward.clone().multiplyScalar(camAngularVelX * i * 0.015);
                
                vel.add(centrifugalForce).add(forwardForce);
                vel.multiplyScalar(0.92); 
                n.oldPos.copy(n.pos); n.pos.add(vel); n.pos.y -= 0.001; 
            }

            let anchorWorld = sys.anchorLocal.clone().applyMatrix4(camera.matrixWorld);
            sys.nodes[0].pos.copy(anchorWorld);

            for(let step=0; step<4; step++) {
                for(let i=0; i<sys.segments; i++) {
                    let n1 = sys.nodes[i], n2 = sys.nodes[i+1];
                    let delta = n2.pos.clone().sub(n1.pos);
                    let dist = delta.length();
                    if(dist > sys.segLen) {
                        let diff = (dist - sys.segLen) / dist;
                        let offset = delta.multiplyScalar(0.5 * diff);
                        if(i > 0) n1.pos.add(offset);
                        n2.pos.sub(offset);
                    }
                }
            }

            for(let i=1; i<=sys.segments; i++) {
                sys.nodes[i].mesh.position.copy(sys.nodes[i].pos);
                if(i < sys.segments) {
                    let dir = sys.nodes[i+1].pos.clone().sub(sys.nodes[i].pos).normalize();
                    let axis = new THREE.Vector3(0,1,0);
                    sys.nodes[i].mesh.quaternion.setFromUnitVectors(axis, dir);
                } else {
                    sys.nodes[i].mesh.rotation.y += 0.03; sys.nodes[i].mesh.rotation.z += 0.02;
                }
            }
        });
    }

    function generateSharedTextures() {
        const noiseCanvas = document.createElement('canvas'); noiseCanvas.width = 256; noiseCanvas.height = 256;
        const nCtx = noiseCanvas.getContext('2d'); const nData = nCtx.createImageData(256, 256);
        for(let i=0; i<nData.data.length; i+=4) { 
            let v = 180 + Math.random()*75; nData.data[i]=v; nData.data[i+1]=v; nData.data[i+2]=v; nData.data[i+3]=255; 
        }
        nCtx.putImageData(nData, 0, 0);
        globalTextures.noiseBump = new THREE.CanvasTexture(noiseCanvas);
        globalTextures.noiseBump.wrapS = THREE.RepeatWrapping; globalTextures.noiseBump.wrapT = THREE.RepeatWrapping;
        globalTextures.noiseBump.repeat.set(10, 10);

        const woodCanvas = document.createElement('canvas'); woodCanvas.width = 512; woodCanvas.height = 512;
        const wdCtx = woodCanvas.getContext('2d');
        wdCtx.fillStyle = '#614029'; wdCtx.fillRect(0, 0, 512, 512); 
        wdCtx.globalAlpha = 0.15;
        for(let i=0; i<400; i++) {
            wdCtx.fillStyle = Math.random() > 0.5 ? '#3a200d' : '#8f6040';
            let w = 2 + Math.random() * 5; let h = 100 + Math.random() * 400;
            wdCtx.fillRect(Math.random()*512, Math.random()*512, w, h);
        }
        for(let i=0; i<15; i++) {
            wdCtx.beginPath(); wdCtx.ellipse(Math.random()*512, Math.random()*512, 4+Math.random()*6, 15+Math.random()*25, 0, 0, Math.PI*2);
            wdCtx.fillStyle = '#3a200d'; wdCtx.fill();
        }
        wdCtx.globalAlpha = 1.0;
        globalTextures.wood = new THREE.CanvasTexture(woodCanvas);
        globalTextures.wood.encoding = THREE.sRGBEncoding;
    }

    function createChalkboardTexture(isAnomaly) {
        const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const ctx = c.getContext('2d');
        ctx.fillStyle = '#15241b'; ctx.fillRect(0,0,1024,512); ctx.globalAlpha = 0.03;
        for(let i=0; i<400; i++) {
            ctx.fillStyle = '#ffffff'; ctx.beginPath();
            ctx.ellipse(Math.random()*1024, Math.random()*512, Math.random()*50+20, Math.random()*15+5, Math.random()*Math.PI, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = '#eeeeee'; ctx.font = 'bold 55px Arial'; ctx.fillText('物理压轴题:', 60, 100);
        ctx.font = '45px Arial'; ctx.fillText('质量 m=2kg, 加速度 a=3m/s², 求合力 F。', 60, 180);
        ctx.fillText('解：由牛顿第二定律 F = m * a', 60, 270); ctx.font = 'bold 85px Courier New';

    function createTextTexture(text, bgColor, textColor, size='40px') {
        const c = document.createElement('canvas'); c.width = 512; c.height = 256; const ctx = c.getContext('2d');

    // --- 游戏循环与核心逻辑 ---
    function setupDay() {
        gameObjects.stage1.blackboard.mesh.material.map = gameObjects.stage1.blackboard.norm;
        gameObjects.stage1.poster.mesh.material.map = gameObjects.stage1.poster.norm;
        gameObjects.stage1.computer.mesh.material.map = gameObjects.stage1.computer.norm;
        gameObjects.stage1.door.material.color.setHex(0x4a2e15);
        gameObjects.stage1.student.head.rotation.y = 0;
        gameObjects.stage1.student.eyes.forEach(e => e.material.color.setHex(0x000000));
        
        gameObjects.stage2.exit_sign.mesh.material.map = gameObjects.stage2.exit_sign.norm;
        gameObjects.stage2.vending_machine.mesh.material.map = gameObjects.stage2.vending_machine.norm;
        gameObjects.stage2.extinguisher.material.color.setHex(0xdd0000);
        gameObjects.stage2.hall_door.rotation.y = 0;
        if(gameObjects.stage2.locker) {
            gameObjects.stage2.locker.group.children.forEach(c => { if(c.isMesh && c.geometry.type==="BoxGeometry" && c.material !== hitMat) c.material = gameObjects.stage2.locker.normMat; });
        }

        hasAnomalyToday = Math.random() < 0.5; 
        if (hasAnomalyToday) {
            if (currentStage === 1) { currentAnomalyId = interactableIds_1[Math.floor(Math.random() * interactableIds_1.length)]; applyAnomalyStage1(currentAnomalyId); }
            else { currentAnomalyId = interactableIds_2[Math.floor(Math.random() * interactableIds_2.length)]; applyAnomalyStage2(currentAnomalyId); }
        } else { currentAnomalyId = null; }

        document.getElementById('day-display').innerText = `第 ${currentDay} 天`;
        document.getElementById('stage-desc').innerText = currentStage === 1 ? "LOC: CLASSROOM" : "LOC: HALLWAY";
        
        resetPlayerPosition();
    }

    function applyAnomalyStage1(id) {
        switch(id) {
            case 'blackboard': gameObjects.stage1.blackboard.mesh.material.map = gameObjects.stage1.blackboard.ano; break;
            case 'poster': gameObjects.stage1.poster.mesh.material.map = gameObjects.stage1.poster.ano; break;
            case 'computer': gameObjects.stage1.computer.mesh.material.map = gameObjects.stage1.computer.ano; break;
            case 'door_stage1': gameObjects.stage1.door.material.color.setHex(0xaa0000); break;
            case 'student': gameObjects.stage1.student.head.rotation.y = Math.PI; gameObjects.stage1.student.eyes.forEach(e => e.material.color.setHex(0xff0000)); break;
        }
    }

    function applyAnomalyStage2(id) {
        switch(id) {
            case 'exit_sign': gameObjects.stage2.exit_sign.mesh.material.map = gameObjects.stage2.exit_sign.ano; break;
            case 'vending_machine': gameObjects.stage2.vending_machine.mesh.material.map = gameObjects.stage2.vending_machine.ano; break;
            case 'extinguisher': gameObjects.stage2.extinguisher.material.color.setHex(0x0000FF); break; 
            case 'hall_door': gameObjects.stage2.hall_door.rotation.y = Math.PI / 4; break; 
            case 'locker': 
                gameObjects.stage2.locker.group.children.forEach(c => { if(c.isMesh && c.geometry.type==="BoxGeometry" && c.material !== hitMat) c.material = gameObjects.stage2.locker.anoMat; });
                break;
        }
    }

    function showRuntimeError(msg) {
        const toast = document.getElementById('error-toast');
        const text = document.getElementById('error-toast-msg');
        if (!toast || !text) return;
        text.innerText = msg;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3200);
    }

    // 核心安全转场：绝对无死锁
    function triggerTransition(title, subtitle, isGameOver = false) {
        if (isTransitioning) return;
        isTransitioning = true; 
        hideReportButton();
        
        const screen = document.getElementById('transition-screen');
        document.getElementById('transition-title').innerText = title; 
        document.getElementById('transition-desc').innerText = subtitle || "";
        
        screen.style.display = 'flex'; void screen.offsetWidth;
        screen.classList.remove('hidden'); screen.style.opacity = '1';

        setTimeout(() => {
            try {
                if (isGameOver) { currentDay = (currentStage === 2) ? 8 : 1; }
                setupDay();
            } catch (err) {
                const reason = err && err.message ? err.message : '未知异常';
                console.error('transition failed:', err);
                showRuntimeError(`换天失败：${reason}（已自动恢复）`);
            } finally {
                screen.style.opacity = '0';
                setTimeout(() => {
                    screen.classList.add('hidden');
                    isTransitioning = false; // 强制解锁，防止死锁
                    lastValidTarget = null;
                    currentLookTarget = null;
                }, 600);
            }
        }, 1500);
    }

    function handleStageTransition() {
        if (currentDay === 8 && currentStage === 1) { 
            currentStage = 2; triggerTransition("第一层突破", "进入无尽走廊", false); return true; 
        }
        return false;
    }

    // --- 极速 UI 响应 (解除了所有的双重判定锁死) ---
    window.reportNormal = function() {
        if (isTransitioning) return;
        // 让 triggerTransition 自己去上锁
        if (hasAnomalyToday) {
            triggerTransition("判断错误", `真正的异常是：${nameMap[currentAnomalyId]}\n时间重置回原点`, true);
        } else {
            currentDay++;
            if(currentDay > MAX_DAYS) { document.getElementById('win-screen').classList.remove('hidden'); isTransitioning = true; }
            else if(!handleStageTransition()) { triggerTransition(`第 ${currentDay} 天`, "安全度过", false); }
        }
    };

    window.reportAnomaly = function() {
        if (isTransitioning) return;
        const reportTarget = currentLookTarget || lastValidTarget;
        if (!reportTarget) {
            triggerTransition("操作无效", "请将准星对准异常物体后再报告", false);
            return; 
        }

        if (hasAnomalyToday && reportTarget === currentAnomalyId) {
            currentDay++;
            if(currentDay > MAX_DAYS) { document.getElementById('win-screen').classList.remove('hidden'); isTransitioning = true; }
            else if(!handleStageTransition()) { triggerTransition("异常清除", `进入第 ${currentDay} 天`, false); }
        } else { 
            let errStr = hasAnomalyToday ? `真正的异常是：${nameMap[currentAnomalyId]}\n你却指认了：${nameMap[reportTarget]}` : `这里明明一切正常\n你却指认了：${nameMap[reportTarget]}`;
            triggerTransition("判断错误", `${errStr}\n时间重置回原点`, true); 
        }
    };

    window.startGame = function() { 
        initAudio(); 
        document.getElementById('start-screen').classList.add('hidden'); 
        setupDay(); 
    };

    function resetPlayerPosition() {
        const center = currentStage === 1 ? STAGE_1_CENTER : STAGE_2_CENTER;
        const zOffset = currentStage === 1 ? 6 : -2; 
        
        camera.position.set(center.x, CAMERA_HEIGHT, center.z + zOffset); 
        targetRotationX = 0; targetRotationY = currentStage === 1 ? 0 : Math.PI; 
        camera.rotation.set(targetRotationX, targetRotationY, 0, 'YXZ');
        prevCamRotX = targetRotationX; prevCamRotY = targetRotationY;
        
        moveState.forward = 0; moveState.right = 0;
        yVelocity = 0; isGrounded = true; window.toggleSprint(false); 
        stepAccumulator = 0; lastStepIndex = 0;

        earringsSystem.forEach(sys => {
            camera.updateMatrixWorld(true);
            let anchorWorld = sys.anchorLocal.clone().applyMatrix4(camera.matrixWorld);
            sys.nodes.forEach(n => { n.pos.copy(anchorWorld); n.oldPos.copy(anchorWorld); });
        });
    }
    
    window.resetView = resetPlayerPosition;
    window.playerJump = function() { if (isGrounded && !isTransitioning) { yVelocity = JUMP_FORCE; isGrounded = false; } }

    window.toggleSprint = function(forceVal = null) {
        if(forceVal !== null) { isSprinting = forceVal; } else { isSprinting = !isSprinting; }
        const btn = document.getElementById('sprint-btn'); const txt = document.getElementById('sprint-txt');
        if(btn) {
            // 已将 isSSprint 改为 isSprinting
            if(isSprinting) { btn.classList.add('btn-active-state'); txt.innerText = '奔跑中'; } 
            else { btn.classList.remove('btn-active-state'); txt.innerText = '步行中'; }
        }
    };

    // 严密封闭式防抖绑定 (杜绝一切死锁)
    function setupControls() {
        const attachSafe = (id, fn) => {
            const el = document.getElementById(id); if(!el) return;
            let locked = false;
            const trigger = (e) => {
                e.preventDefault(); e.stopPropagation(); 
                if(locked) return; locked = true; fn();
                setTimeout(() => { locked = false; }, 300); // 300ms防连点
            };
            el.addEventListener('touchstart', trigger, {passive: false});
            el.addEventListener('mousedown', trigger);
        };
        attachSafe('normal-btn', window.reportNormal);
        attachSafe('report-btn', window.reportAnomaly);
        attachSafe('start-btn', window.startGame);
        attachSafe('jump-btn', window.playerJump);
        attachSafe('sprint-btn', window.toggleSprint);
        attachSafe('reset-btn', window.resetView);

        document.addEventListener('keydown', (e) => {
            if(isTransitioning) return;
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': moveState.forward = 1; break;
                case 'KeyS': case 'ArrowDown': moveState.forward = -1; break;
                case 'KeyA': case 'ArrowLeft': moveState.right = -1; break;
                case 'KeyD': case 'ArrowRight': moveState.right = 1; break;
                case 'Space': window.playerJump(); break;
                case 'ShiftLeft': case 'ShiftRight': window.toggleSprint(true); break; 
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': case 'KeyS': case 'ArrowDown': moveState.forward = 0; break;
                case 'KeyA': case 'ArrowLeft': case 'KeyD': case 'ArrowRight': moveState.right = 0; break;
                case 'ShiftLeft': case 'ShiftRight': window.toggleSprint(false); break; 
            }
        });

        const joyBase = document.getElementById('joystick-base'); const joyStick = document.getElementById('joystick-stick');
        let moveTouchId = null; let joyCenter;
        
        joyBase.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation(); if(isTransitioning) return;
            joyCenter = { x: joyBase.getBoundingClientRect().left + 65, y: joyBase.getBoundingClientRect().top + 65 };
            moveTouchId = e.changedTouches[0].identifier; joyStick.style.transition = 'none'; updateJoy(e.changedTouches[0]);
        }, {passive: false});
        joyBase.addEventListener('touchmove', (e) => {
            e.preventDefault(); e.stopPropagation(); if(isTransitioning) return;
            for(let i=0; i<e.changedTouches.length; i++) { if(e.changedTouches[i].identifier === moveTouchId) updateJoy(e.changedTouches[i]); }
        }, {passive: false});
        const stopJoy = (e) => {
            e.preventDefault(); e.stopPropagation();
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === moveTouchId) {
                    moveTouchId = null; moveState.forward = 0; moveState.right = 0; 
                    joyStick.style.transition = 'transform 0.1s'; joyStick.style.transform = 'translate(-50%, -50%)';
                }
            }
        };
        joyBase.addEventListener('touchend', stopJoy); joyBase.addEventListener('touchcancel', stopJoy);

        function updateJoy(touch) {
            let dx = touch.clientX - joyCenter.x, dy = touch.clientY - joyCenter.y;
            let dist = Math.sqrt(dx*dx + dy*dy); if(dist > 50) { dx = (dx/dist)*50; dy = (dy/dist)*50; }
            joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            moveState.right = dx / 50; moveState.forward = -dy / 50; 
        }

        const canvas = renderer.domElement; let lookTouchId = null;
        canvas.addEventListener('mousedown', (e) => { isLooking = true; prevLookX = e.clientX; prevLookY = e.clientY; });
        document.addEventListener('mousemove', (e) => {
            if (isLooking && !isTransitioning) {
                targetRotationY -= (e.clientX - prevLookX) * 0.005; targetRotationX -= (e.clientY - prevLookY) * 0.005;
                targetRotationX = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, targetRotationX));
                prevLookX = e.clientX; prevLookY = e.clientY;
            }
        });
        document.addEventListener('mouseup', () => isLooking = false);

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); if(isTransitioning) return;
            for(let i=0; i<e.changedTouches.length; i++) {
                if (lookTouchId === null) { lookTouchId = e.changedTouches[i].identifier; prevLookX = e.changedTouches[i].clientX; prevLookY = e.changedTouches[i].clientY; }
            }
        }, {passive: false});
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); if(isTransitioning) return;
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === lookTouchId) {
                    targetRotationY -= (e.changedTouches[i].clientX - prevLookX) * 0.006; targetRotationX -= (e.changedTouches[i].clientY - prevLookY) * 0.006;
                    targetRotationX = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, targetRotationX));
                    prevLookX = e.changedTouches[i].clientX; prevLookY = e.changedTouches[i].clientY;
                }
            }
        }, {passive: false});
        const stopLook = (e) => { for(let i=0; i<e.changedTouches.length; i++) { if(e.changedTouches[i].identifier === lookTouchId) lookTouchId = null; } };
        canvas.addEventListener('touchend', stopLook); canvas.addEventListener('touchcancel', stopLook);
    }

    function onWindowResize() { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }

    function updateMovement() {
        if (isTransitioning) return;
        camera.rotation.y += (targetRotationY - camera.rotation.y) * 0.3; camera.rotation.x += (targetRotationX - camera.rotation.x) * 0.3;

        if (!isGrounded || yVelocity !== 0) {
            yVelocity -= GRAVITY; camera.position.y += yVelocity;
            if (camera.position.y <= CAMERA_HEIGHT) { camera.position.y = CAMERA_HEIGHT; yVelocity = 0; isGrounded = true; }
        }

        let targetSpeed = isSprinting ? SPRINT_SPEED : WALK_SPEED;
        currentSpeed += (targetSpeed - currentSpeed) * 0.15;
        let tFov = isSprinting ? 95 : 75; 
        camera.fov += (tFov - camera.fov) * 0.1; camera.updateProjectionMatrix();

        let isMoving = Math.abs(moveState.forward) > 0 || Math.abs(moveState.right) > 0;

        if (isMoving) {
            const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
            const rightDir = new THREE.Vector3().crossVectors(dir, camera.up).normalize();

            camera.position.addScaledVector(dir, moveState.forward * currentSpeed);
            camera.position.addScaledVector(rightDir, moveState.right * currentSpeed);

            const cx = currentStage === 1 ? STAGE_1_CENTER.x : STAGE_2_CENTER.x;
            const bx = currentStage === 1 ? 8.5 : 2.5;  
            const bzMin = currentStage === 1 ? -8.5 : -49; 
            const bzMax = currentStage === 1 ? 8.5 : -1;

            camera.position.x = Math.max(cx - bx, Math.min(cx + bx, camera.position.x));
            camera.position.z = Math.max(bzMin, Math.min(bzMax, camera.position.z));
            
            if (isGrounded) {
                stepAccumulator += currentSpeed * (isSprinting ? 2.5 : 2.0);
                let currentStepIndex = Math.floor(stepAccumulator / Math.PI);
                if(currentStepIndex > lastStepIndex) {
                    playHeelStep(isSprinting ? 1.0 : 0.6);
                    lastStepIndex = currentStepIndex;
                }

                const bobFreq = isSprinting ? 0.03 : 0.015; 
                const bobAmp = isSprinting ? 0.15 : 0.06; 
                camera.position.y = CAMERA_HEIGHT + Math.sin(Date.now() * bobFreq) * bobAmp * (Math.abs(moveState.forward) + Math.abs(moveState.right));
            }
        } else if (isGrounded) { camera.position.y += (CAMERA_HEIGHT - camera.position.y) * 0.2; }

        // --- 身体高跟鞋步伐渲染 (防穿模且朝向正向) ---
        const footOffsetX = 0.15; 
        const footOffsetZ = 0.15; 
        const leftBase = new THREE.Vector3(-footOffsetX, 0, -footOffsetZ);
        leftBase.applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);
        leftBase.add(camera.position);

        const rightBase = new THREE.Vector3(footOffsetX, 0, -footOffsetZ);
        rightBase.applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);
        rightBase.add(camera.position);

        let liftL = 0, liftR = 0;
        if(isMoving && isGrounded) {
            liftL = Math.max(0, Math.sin(stepAccumulator));
            liftR = Math.max(0, Math.sin(stepAccumulator + Math.PI));
        }

        leftShoeMesh.position.set(leftBase.x, 0.02 + liftL * 0.12, leftBase.z);
        rightShoeMesh.position.set(rightBase.x, 0.02 + liftR * 0.12, rightBase.z);
        leftShoeMesh.rotation.set(liftL * -0.2, camera.rotation.y, 0);
        rightShoeMesh.rotation.set(liftR * -0.2, camera.rotation.y, 0);
    }

    function checkRaycast() {
        if (isTransitioning) return;
        raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
        const intersects = raycaster.intersectObjects(scene.children, true);
        
        let foundTarget = null;
        for (let i=0; i<intersects.length; i++) {
            if (intersects[i].distance > 15) continue; 
            if (intersects[i].object.userData.id) { foundTarget = intersects[i].object.userData.id; break; }
        }

        if (foundTarget) { 
            currentLookTarget = foundTarget; 
            lastValidTarget = foundTarget; 
            showReportButton(); 
        } else { 
            currentLookTarget = null; 
            hideReportButton(); 
        }
    }

    function showReportButton() {
        const btn = document.getElementById('report-btn');
        const tgtName = document.getElementById('target-name');
        if (btn.classList.contains('hidden')) {
            btn.classList.remove('hidden'); document.getElementById('crosshair').classList.add('crosshair-active');
        }
        const newText = `目标: ${nameMap[lastValidTarget] || '未知'}`;
        if (tgtName.innerText !== newText) tgtName.innerText = newText;
    }
    
    function hideReportButton() {
        const btn = document.getElementById('report-btn');
        if (!btn.classList.contains('hidden')) {
            btn.classList.add('hidden'); document.getElementById('crosshair').classList.remove('crosshair-active');
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        updateMovement();
        updateEarringsPhysics();
        checkRaycast();

        if (!isTransitioning) {
            if (currentStage === 1) {
                if(hasAnomalyToday && currentAnomalyId === 'clock') gameObjects.stage1.clock.hand.rotation.z += 0.05; 
                else gameObjects.stage1.clock.hand.rotation.z -= 0.01; 
            }
        }
        renderer.render(scene, camera);
    }

    window.onload = init;
</script>
</body>
