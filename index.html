<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>校园怪谈：最终修复版</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'PingFang SC', sans-serif; background: #000; touch-action: none; user-select: none; }
        #ui-layer { pointer-events: none; z-index: 10; }
        .interactive { pointer-events: auto; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: rgba(255, 255, 255, 0.9); border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 20; transition: all 0.2s;
        }
        .crosshair-active { width: 20px !important; height: 20px !important; background: rgba(255, 30, 30, 0.8) !important; border: 2px solid #fff; }
        #joystick-base { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; z-index: 50; }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); }
        .action-btn { position: absolute; right: 40px; width: 70px; height: 70px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; z-index: 50; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .btn-active { background: rgba(255, 50, 50, 0.5) !important; }
        #jump-btn { bottom: 40px; }
        #sprint-btn { bottom: 130px; }
    </style>
</head>
<body>

<div id="crosshair"></div>
<div id="ui-layer" class="fixed inset-0 flex flex-col justify-between">
    <div class="p-6 flex justify-between items-start text-white">
        <div class="bg-black/60 p-4 rounded-xl border border-gray-700 backdrop-blur-md">
            <h1 class="text-3xl font-black text-red-500 tracking-widest" id="day-display">第 1 天</h1>
            <p class="text-xs text-gray-300 mt-1 font-mono" id="stage-desc">LOC: CLASSROOM</p>
        </div>
        <div id="reset-btn" class="bg-black/50 px-4 py-2 rounded-lg border border-gray-700 interactive cursor-pointer">
            <p class="text-xs font-bold text-gray-400">↻ 重置视角</p>
        </div>
    </div>

    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 interactive">
        <button id="report-btn" class="hidden px-8 py-3 bg-red-700 text-white font-bold rounded-xl border border-red-400 shadow-[0_0_20px_rgba(255,0,0,0.5)]">
            ⚠️ 报告异常: <span id="target-name">未知</span>
        </button>
    </div>

    <div id="joystick-base" class="hidden interactive"><div id="joystick-stick"></div></div>
    <div id="jump-btn" class="action-btn hidden interactive">跳跃</div>
    <div id="sprint-btn" class="action-btn hidden interactive">步行</div>

    <div class="mb-10 w-full flex justify-center interactive">
        <button id="normal-btn" class="px-12 py-4 bg-gray-900 border border-gray-500 text-white font-bold rounded-full text-lg shadow-2xl">
            🚪 一切正常 (进入下一天)
        </button>
    </div>

    <div id="start-screen" class="absolute inset-0 bg-black flex flex-col items-center justify-center p-6 text-center interactive z-50">
        <h2 class="text-6xl font-black mb-4 text-red-600">校园怪谈</h2>
        <p class="text-gray-400 mb-8 max-w-md">寻找环境中的异常。如果没有异常，直接推门。如果发现异常，准星对准它并点击报告。</p>
        <button id="start-btn" class="px-14 py-4 bg-red-800 text-white font-black rounded-full text-xl shadow-lg">进入校园</button>
    </div>

    <div id="transition-screen" class="hidden absolute inset-0 bg-black flex flex-col items-center justify-center text-center z-[100]">
        <h2 id="transition-title" class="text-5xl font-black text-white mb-4"></h2>
        <p id="transition-desc" class="text-red-500 text-xl font-bold"></p>
    </div>
</div>

<script>
    // --- 核心变量 ---
    let scene, camera, renderer, raycaster;
    let currentDay = 1, currentStage = 1; 
    let hasAnomalyToday = false, currentAnomalyId = null;
    let isTransitioning = false, currentLookTarget = null;
    
    // 运动状态
    const moveState = { forward: 0, right: 0 };
    let isSprinting = false, yVelocity = 0, isGrounded = true;
    const WALK_SPEED = 0.06, SPRINT_SPEED = 0.13, GRAVITY = 0.01, JUMP_FORCE = 0.18;
    
    const gameObjects = { stage1: {}, stage2: {} };
    const nameMap = {
        'blackboard': '黑板', 'clock': '时钟', 'student': '同学', 'poster': '海报', 
        'computer': '电脑', 'exit_sign': '安全出口', 'extinguisher': '灭火器', 'locker': '储物柜'
    };

    // --- 初始化 ---
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.05);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.rotation.order = 'YXZ';

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        raycaster = new THREE.Raycaster();

        // 基本灯光
        const ambient = new THREE.AmbientLight(0xffffff, 0.2); scene.add(ambient);
        const sun = new THREE.PointLight(0xffffff, 0.8, 50); sun.position.set(0, 8, 0); scene.add(sun);

        buildClassroom();
        setupControls();
        
        if ('ontouchstart' in window) {
            document.getElementById('joystick-base').classList.remove('hidden');
            document.getElementById('jump-btn').classList.remove('hidden');
            document.getElementById('sprint-btn').classList.remove('hidden');
        }

        animate();
    }

    // --- 场景构建 (简化示例版以便代码完整运行) ---
    function buildClassroom() {
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({color: 0x222222}));
        floor.rotation.x = -Math.PI/2; scene.add(floor);

        const wall = new THREE.Mesh(new THREE.BoxGeometry(20, 10, 20), new THREE.MeshStandardMaterial({color: 0x444444, side: THREE.BackSide}));
        wall.position.y = 5; scene.add(wall);

        // 交互物体：黑板
        const bb = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), new THREE.MeshStandardMaterial({color: 0x113311}));
        bb.position.set(0, 3, -9.8); bb.userData.id = 'blackboard';
        scene.add(bb); gameObjects.stage1.blackboard = bb;
    }

    // --- 核心逻辑：切换天数 ---
    function setupDay() {
        hasAnomalyToday = Math.random() < 0.5;
        currentAnomalyId = hasAnomalyToday ? 'blackboard' : null;

        // 重置环境
        gameObjects.stage1.blackboard.material.color.setHex(hasAnomalyToday ? 0xff0000 : 0x113311);
        
        document.getElementById('day-display').innerText = `第 ${currentDay} 天`;
        resetPlayer();
    }

    function triggerTransition(title, subtitle, isReset = false) {
        if (isTransitioning) return;
        isTransitioning = true;

        const screen = document.getElementById('transition-screen');
        document.getElementById('transition-title').innerText = title;
        document.getElementById('transition-desc').innerText = subtitle;
        
        screen.classList.remove('hidden');
        screen.style.opacity = '1';

        setTimeout(() => {
            if (isReset) currentDay = 1;
            setupDay();
            
            screen.style.opacity = '0';
            setTimeout(() => {
                screen.classList.add('hidden');
                isTransitioning = false;
            }, 500);
        }, 1500);
    }

    // --- 交互响应 ---
    function handleNormal() {
        if (isTransitioning) return;
        if (hasAnomalyToday) {
            triggerTransition("判断错误", "你漏掉了某个异常...", true);
        } else {
            currentDay++;
            triggerTransition(`第 ${currentDay} 天`, "一切正常，继续前进");
        }
    }

    function handleReport() {
        if (isTransitioning || !currentLookTarget) return;
        if (hasAnomalyToday && currentLookTarget === currentAnomalyId) {
            currentDay++;
            triggerTransition("报告正确", "成功清除异常");
        } else {
            triggerTransition("报告错误", "那并不是异常...", true);
        }
    }

    // --- 控制系统 ---
    function setupControls() {
        const startBtn = document.getElementById('start-btn');
        startBtn.onclick = () => {
            document.getElementById('start-screen').classList.add('hidden');
            setupDay();
        };

        document.getElementById('normal-btn').onclick = handleNormal;
        document.getElementById('report-btn').onclick = handleReport;
        document.getElementById('reset-btn').onclick = resetPlayer;

        // 键盘
        window.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': moveState.forward = 1; break;
                case 'KeyS': moveState.forward = -1; break;
                case 'KeyA': moveState.right = -1; break;
                case 'KeyD': moveState.right = 1; break;
                case 'ShiftLeft': toggleSprint(true); break;
                case 'Space': jump(); break;
            }
        });
        window.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': case 'KeyS': moveState.forward = 0; break;
                case 'KeyA': case 'KeyD': moveState.right = 0; break;
                case 'ShiftLeft': toggleSprint(false); break;
            }
        });

        // 鼠标视角
        let isPointerLocked = false;
        renderer.domElement.addEventListener('click', () => {
            if (!isTransitioning) renderer.domElement.requestPointerLock();
        });
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement && !isTransitioning) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
            }
        });
    }

    function toggleSprint(active) {
        isSprinting = active;
        const btn = document.getElementById('sprint-btn');
        if (btn) {
            btn.innerText = isSprinting ? '奔跑中' : '步行';
            isSprinting ? btn.classList.add('btn-active') : btn.classList.remove('btn-active');
        }
    }

    function jump() {
        if (isGrounded && !isTransitioning) {
            yVelocity = JUMP_FORCE;
            isGrounded = false;
        }
    }

    function resetPlayer() {
        camera.position.set(0, 1.6, 8);
        camera.rotation.set(0, 0, 0);
    }

    // --- 主循环 ---
    function animate() {
        requestAnimationFrame(animate);
        if (!isTransitioning) {
            // 移动逻辑
            const speed = isSprinting ? SPRINT_SPEED : WALK_SPEED;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; dir.normalize();
            const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();

            camera.position.addScaledVector(dir, moveState.forward * speed);
            camera.position.addScaledVector(side, -moveState.right * speed);

            // 重力
            if (!isGrounded) {
                yVelocity -= GRAVITY;
                camera.position.y += yVelocity;
                if (camera.position.y <= 1.6) {
                    camera.position.y = 1.6;
                    isGrounded = true;
                }
            }

            // 射线交互检测
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(scene.children);
            let found = null;
            for (let i = 0; i < intersects.length; i++) {
                if (intersects[i].distance < 25 && intersects[i].object.userData.id) {
                    found = intersects[i].object.userData.id;
                    break;
                }
            }

            if (found) {
                currentLookTarget = found;
                document.getElementById('report-btn').classList.remove('hidden');
                document.getElementById('target-name').innerText = nameMap[found] || found;
                document.getElementById('crosshair').classList.add('crosshair-active');
            } else {
                currentLookTarget = null;
                document.getElementById('report-btn').classList.add('hidden');
                document.getElementById('crosshair').classList.remove('crosshair-active');
            }
        }
        renderer.render(scene, camera);
    }

    window.onload = init;
    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>
